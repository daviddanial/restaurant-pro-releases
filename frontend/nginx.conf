server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 512m;
  }

  # index.html must never be cached: it points at hashed chunk names that change on
  # every build. A stale copy makes lazy route chunks 404 → the SPA hangs on
  # "Loading study…" until a hard refresh.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
  }

  # Hashed assets are content-addressed → safe to cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
