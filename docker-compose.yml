services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telerad
      POSTGRES_USER: telerad
      POSTGRES_PASSWORD: telerad
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telerad -d telerad"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/telerad || true;
      exit 0;
      "

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: telerad
      RABBITMQ_DEFAULT_PASS: telerad
      # No scheduler busy-waiting: an idle broker otherwise keeps CPU cores spinning.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # Each check boots a CLI Erlang VM (~1 s of CPU), so poll fast only during startup.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 3s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: api,worker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telerad
      SPRING_DATASOURCE_USERNAME: telerad
      SPRING_DATASOURCE_PASSWORD: telerad
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: telerad
      SPRING_RABBITMQ_PASSWORD: telerad
      TELERAD_S3_ENDPOINT: http://minio:9000
      TELERAD_S3_ACCESS_KEY: minioadmin
      TELERAD_S3_SECRET_KEY: minioadmin
      TELERAD_S3_BUCKET: telerad
      TELERAD_JWT_SECRET: change-me-in-production-use-a-long-secret-key-32chars
      TELERAD_SCP_ENABLED: "false"
      TELERAD_NOTIFY_EMAIL_ENABLED: "true"
      TELERAD_NOTIFY_WEBHOOK_ENABLED: "true"
      TELERAD_SLA_ENABLED: "true"
      TELERAD_GATEWAY_BEARER_DEV: "true"
      TELERAD_GATEWAY_CA_DIR: /app/certs/gateway-ca
      TELERAD_GATEWAY_SERVER_KEYSTORE: /app/certs/gateway-ca/server.p12
      TELERAD_GATEWAY_MTLS_ENABLED: "true"
      TELERAD_GATEWAY_MTLS_PORT: "8443"
    ports:
      - "38471:8080"
      - "38473:8443"
    volumes:
      - gateway_ca:/app/certs/gateway-ca
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  dicom-scp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: scp
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telerad
      SPRING_DATASOURCE_USERNAME: telerad
      SPRING_DATASOURCE_PASSWORD: telerad
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: telerad
      SPRING_RABBITMQ_PASSWORD: telerad
      TELERAD_S3_ENDPOINT: http://minio:9000
      TELERAD_S3_ACCESS_KEY: minioadmin
      TELERAD_S3_SECRET_KEY: minioadmin
      TELERAD_S3_BUCKET: telerad
      TELERAD_JWT_SECRET: change-me-in-production-use-a-long-secret-key-32chars
      TELERAD_SCP_ENABLED: "true"
      TELERAD_SCP_AE_TITLE: TELERAD_SCP
      TELERAD_SCP_PORT: "11112"
      SERVER_PORT: "8081"
    ports:
      - "11112:11112"
      - "38472:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  gateway_ca:
